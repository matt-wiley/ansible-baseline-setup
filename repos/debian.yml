---
# Vendor repos for the Debian family. Apt signatures are verified by apt; no debsig policy is installed.
- name: Install python3-debian (needed by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    cache_valid_time: 3600

- name: Add 1Password apt repository
  ansible.builtin.deb822_repository:
    name: 1password
    types: [deb]
    uris: "https://downloads.1password.com/linux/debian/{{ deb_arch }}"
    suites: [stable]
    components: [main]
    architectures: ["{{ deb_arch }}"]
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
  register: repo_1password
  when: "'1password' in needed_repos"

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: "'github-cli' in needed_repos"

- name: Install the GitHub CLI signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  when: "'github-cli' in needed_repos"

- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: https://cli.github.com/packages
    suites: [stable]
    components: [main]
    architectures: ["{{ deb_arch }}"]
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
  register: repo_github_cli
  when: "'github-cli' in needed_repos"

- name: Install extrepo (Librewolf's recommended repo method)
  ansible.builtin.apt:
    name: extrepo
    state: present
  when: "'librewolf' in needed_repos"

- name: Enable the Librewolf repository
  ansible.builtin.command:
    cmd: extrepo enable librewolf
    creates: /etc/apt/sources.list.d/extrepo_librewolf.sources
  register: repo_librewolf
  when: "'librewolf' in needed_repos"

- name: Refresh apt cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: repo_1password is changed or repo_github_cli is changed or repo_librewolf is changed
