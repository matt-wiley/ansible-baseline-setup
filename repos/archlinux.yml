---
# Arch has no vendor repos; vendor apps come from the AUR (ADR 0002). This sets up the AUR builder.
# kewlfft.aur needs a non-root user that can run pacman without a password.
- name: Install AUR build prerequisites
  ansible.builtin.package:
    name: [base-devel, git]
    state: present

- name: Create the aur_builder user
  ansible.builtin.user:
    name: aur_builder
    group: wheel
    create_home: true

- name: Let aur_builder run pacman without a password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    mode: "0440"
    validate: visudo -cf %s

- name: Install paru
  kewlfft.aur.aur:
    name: paru-bin
    use: makepkg
    state: present
  become: true
  become_user: aur_builder
