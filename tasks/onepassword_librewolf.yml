---
# Lets the 1Password desktop app talk to the native Librewolf extension (ADR 0005).
# Signing in and enabling the browser integration in 1Password stay manual.
- name: Ensure /etc/1password exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    mode: "0755"
  become: true

- name: Allow Librewolf to connect to 1Password
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: librewolf
    create: true
    mode: "0755"
  become: true

- name: Create Librewolf's native messaging directory
  ansible.builtin.file:
    path: "{{ target_home }}/.librewolf/native-messaging-hosts"
    state: directory
    mode: "0755"

# Prefer a manifest the package ships; otherwise write one pointing at the package's
# BrowserSupport binary. Either way no manual step is left.
- name: List files installed by the 1Password package
  ansible.builtin.command:
    argv: "{{ package_files_cmd[ansible_os_family] }}"
  vars:
    package_files_cmd:
      Debian: [dpkg, -L, 1password]
      RedHat: [rpm, -ql, 1password]
      Archlinux: [pacman, -Qlq, 1password]
  register: onepassword_files
  changed_when: false

- name: Locate the shipped manifest and the BrowserSupport binary
  ansible.builtin.set_fact:
    onepassword_manifest: >-
      {{ onepassword_files.stdout_lines
         | select('search', 'com\.1password\.1password\.json$')
         | first | default('') }}
    onepassword_browser_support: >-
      {{ onepassword_files.stdout_lines
         | select('search', '/1Password-BrowserSupport$')
         | first | default('') }}

- name: Link the manifest shipped by the package
  ansible.builtin.file:
    src: "{{ onepassword_manifest }}"
    dest: "{{ target_home }}/.librewolf/native-messaging-hosts/com.1password.1password.json"
    state: link
  when: onepassword_manifest | length > 0

- name: Require the BrowserSupport binary when no manifest is shipped
  ansible.builtin.assert:
    that: onepassword_browser_support | length > 0
    fail_msg: "The 1Password package lists neither a native messaging manifest nor 1Password-BrowserSupport."
  when: onepassword_manifest | length == 0

- name: Write the native messaging manifest
  ansible.builtin.template:
    src: 1password-native-messaging.json.j2
    dest: "{{ target_home }}/.librewolf/native-messaging-hosts/com.1password.1password.json"
    mode: "0644"
  when: onepassword_manifest | length == 0
