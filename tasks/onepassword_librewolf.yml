---
# Lets the 1Password desktop app talk to the native Librewolf extension (ADR 0005).
# Signing in and enabling the browser integration in 1Password stay manual.
- name: Ensure /etc/1password exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    mode: "0755"
  become: true

- name: Allow Librewolf to connect to 1Password
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: librewolf
    create: true
    mode: "0755"
  become: true

- name: Create Librewolf's native messaging directory
  ansible.builtin.file:
    path: "{{ target_home }}/.librewolf/native-messaging-hosts"
    state: directory
    mode: "0755"

# The manifest's location varies, so ask the package manager which file the package installed.
- name: List files installed by the 1Password package
  ansible.builtin.command:
    argv: "{{ package_files_cmd[ansible_os_family] }}"
  vars:
    package_files_cmd:
      Debian: [dpkg, -L, 1password]
      RedHat: [rpm, -ql, 1password]
      Archlinux: [pacman, -Qlq, 1password]
  register: onepassword_files
  changed_when: false

- name: Find 1Password's native messaging manifest
  ansible.builtin.set_fact:
    onepassword_manifest: >-
      {{ onepassword_files.stdout_lines
         | select('search', 'com\.1password\.1password\.json$')
         | first | default('') }}

- name: Link 1Password's native messaging manifest
  ansible.builtin.file:
    src: "{{ onepassword_manifest }}"
    dest: "{{ target_home }}/.librewolf/native-messaging-hosts/com.1password.1password.json"
    state: link
  when: onepassword_manifest | length > 0

- name: Report a missing manifest
  ansible.builtin.debug:
    msg: >-
      The 1Password package lists no com.1password.1password.json, so the Librewolf link was
      skipped. Find where it lands after first launch and link it manually.
  when: onepassword_manifest | length == 0
