---
# Lets the 1Password desktop app talk to the native Librewolf extension (ADR 0005).
# Signing in and enabling the browser integration in 1Password stay manual.
- name: Ensure /etc/1password exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    mode: "0755"
  become: true

- name: Allow Librewolf to connect to 1Password
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: librewolf
    create: true
    mode: "0755"
  become: true

- name: Create Librewolf's native messaging directory
  ansible.builtin.file:
    path: "{{ target_home }}/.librewolf/native-messaging-hosts"
    state: directory
    mode: "0755"

- name: Link 1Password's native messaging manifest
  ansible.builtin.file:
    src: /usr/lib/mozilla/native-messaging-hosts/com.1password.1password.json
    dest: "{{ target_home }}/.librewolf/native-messaging-hosts/com.1password.1password.json"
    state: link
